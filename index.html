<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div id = "header">
            <h1 id = "title">Metric/Imperial Unit Conversion</h1>
            <input type = "number" id = "user-input">
            <button id = "convert-btn">Convert</button>
        </div>
        <div id = "conversion-section">
            <div class = "conversion-display">
                <h3>Length (Meter/Feet)</h3>
                <p id= "length-conversions"><p>
            </div>
            <div class = "conversion-display">
                <h3>Volume (Liters/Gallons)</h3>
                <p id= "volume-conversions"><p>
            </div>
            <div class = "conversion-display">
                <h3>Mass (Kilograms/Pounds)</h3>
                <p id= "mass-conversions"><p>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
